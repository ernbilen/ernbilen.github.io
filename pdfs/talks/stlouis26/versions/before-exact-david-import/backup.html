name: weights

# Players or games?

| Pooled resignation estimate | Change | p-value |
|:--|--:|--:|
| Each player weighted equally | −1.46 pp | .022 |
| Each game weighted equally | −0.46 pp | .0005 |

&lt;br/&gt;

- Equal game weights give more influence to very active players
- The two estimates answer different averaging questions
- Both measure changes relative to the same player's other games

???

**Answer:** Equal-player weights give occasional players more weight than equal-game weights do. The gap is consistent with a smaller response among the most active players, but comparisons across activity groups are imprecise. It is not evidence that an individual's response fades through repeated contact.

**Source:** David's deck, headline and Per-player vs per-game estimates.

# Resignation by conflict

| Conflict | Change (pp) | p-value |

&lt;br/&gt;

- Raw-record sample; **each game weighted equally**
- The Israel–Palestine estimate is imprecise and borderline at a 5% threshold
- No detectable resignation change in Armenia–Azerbaijan

**Source:** David's deck, By conflict and forest_raw.pdf. Negative means a decline in resignation probability against opposing-country opponents after onset, relative to the same player's other games. P-values are rounded as in the supplied figure. A nonsignificant result is not proof of zero effect.

name: openings

# Opening repertoires

&lt;img class="figure-wide" src="assets/openings_main.png" alt="Repertoire deviation rises by 0.087 overall, with the largest increase, 0.861, in Armenia–Azerbaijan." /&gt;

- Each opening is scored against the player's **own pre-war repertoire**
- Higher index = an opening that player had used less often

???

**Answer:** The index is minus the log of the opening's pre-war frequency for that player. An increase of 0.1 corresponds to an opening used roughly 10 percent less often before the war. This is not an aggressiveness index. Armenia–Azerbaijan has the largest departure; its resignation effect is not detectably different from zero.

**Source:** David's deck, A different margin: departures from habitual openings; openings_main.pdf.

name: limitations

# What could affect the comparison?

- Displayed flags are self-reported; they need not mean citizenship
- We cannot observe games aborted before the first move
- Players' availability and the opponents they meet can change
- Contact with the other side fell after onset, especially in Ukraine–Russia
- The records show behavior, not the player's motive

???

**Answer:** Russia's April 23, 2022 block of the platform is relevant to changing opponent availability. Calendar controls do not remove every possible change in who meets whom. The contact fall is consistent with a supply-of-opponents explanation, while some avoidance cannot be ruled out. The flag-stability audit is reassuring but does not make flags citizenship. The pooled result is not a statement that every war or every individual produces the same behavior.

**Source:** David's deck, Limitations; What does it mean to keep playing a lost position? Contact evidence is marked in the supplied deck's README as newer than the paper.</textarea>
